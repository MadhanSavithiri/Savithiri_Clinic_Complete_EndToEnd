{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<p>{{ body }}</p>
<form method="post">{% csrf_token %}
  <div class="actions">
    <button class="btn danger" type="submit">{{ button }}</button>
    <a class="btn secondary" href="{% url 'accounts:user_detail' target.pk %}">Cancel</a>
  </div>
</form>
{% endblock %}
